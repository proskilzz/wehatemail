name: Build installers

# Manual test builds: Actions tab > Build installers > Run workflow.
# Installers are uploaded as workflow artifacts, no release needed.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            glob: release/*.dmg
          - os: windows-latest
            name: windows
            glob: release/*.exe
          - os: ubuntu-latest
            name: linux
            glob: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
